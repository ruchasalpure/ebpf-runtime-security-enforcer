spec_version: "0.1.0"
name: ebpf-runtime-security-enforcer
version: 1.0.0
description: Leverages kernel-space eBPF tracepoints and LSM hooks to intercept container privilege escalation, unauthorized socket creation, and fileless binary execution.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - lsm-syscall-filtering
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - cybersecurity
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/ebpf-runtime-security-enforcer"
